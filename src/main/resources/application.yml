spring:
  application:
    name: pos-configuracion
  # Conexión a MySQL. En Docker Compose los valores llegan por variables de entorno desde el .env.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pos}
    username: ${DB_USUARIO:pos}
    password: ${DB_CLAVE:}

pos:
  # Valores iniciales de la configuración. Se cambian en ejecución con PUT /api/configuracion/{clave}.
  configuracion:
    formato-fecha: yyyy/MM/dd
    formato-moneda: "#,##0.00"

management:
  endpoints:
    web:
      exposure:
        include: health
